<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" style="font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="960" height="456" fill="#ffffff"/><rect x="20" y="20" width="170" height="200" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="105" y="48" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">Inputs</text><rect x="40" y="66" width="130" height="62" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="105" y="103" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">Scanned page</text><rect x="40" y="140" width="130" height="62" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="105" y="177" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">Transcription</text><line x1="190" y1="97" x2="232" y2="97" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="236" y="20" width="250" height="200" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="361" y="48" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">① Three readers</text><rect x="252" y="64" width="218" height="42" rx="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="264" y="82" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Draft OCR (witness)</text><text x="264" y="99" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">labels differences</text><rect x="252" y="114" width="218" height="42" rx="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="264" y="132" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Independent OCR</text><text x="264" y="149" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">e.g. MinerU</text><rect x="252" y="164" width="218" height="42" rx="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="264" y="182" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Literal OCR</text><text x="264" y="199" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">RapidOCR, no language model</text><line x1="486" y1="120" x2="528" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><path d="M170,171 H206 V242 H600 V226" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="532" y="20" width="408" height="200" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/><text x="736" y="48" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle">② Program finds every spot</text><text x="552" y="80" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">• Character diff vs each reader</text><text x="552" y="110" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">• House-style lint</text><text x="552" y="140" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">• Text no reader produced</text><text x="552" y="170" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">• Handwriting &amp; must-see regions → human</text><text x="552" y="205" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Noise removed: reading order, page numbers, frequent confusions</text><line x1="736" y1="220" x2="736" y2="262" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="266" width="920" height="170" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="40" y="294" font-size="16" fill="#15803d" font-weight="700" text-anchor="start">③ Judge only the spots</text><rect x="40" y="312" width="170" height="56" rx="8" fill="#fff" stroke="#bbf7d0" stroke-width="1.5"/><text x="125" y="345" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">Crop the line, ×2</text><line x1="210" y1="340" x2="246" y2="340" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="312" width="210" height="56" rx="8" fill="#fff" stroke="#bbf7d0" stroke-width="1.5"/><text x="355" y="335" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Vision model copies it blind</text><text x="355" y="355" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">no candidates, no example words</text><line x1="460" y1="340" x2="496" y2="340" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="312" width="120" height="56" rx="8" fill="#fff" stroke="#bbf7d0" stroke-width="1.5"/><text x="560" y="345" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">Program votes</text><line x1="620" y1="340" x2="676" y2="318" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="300" width="240" height="38" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="694" y="324" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="start">Likely wrong</text><text x="906" y="324" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">shown first</text><line x1="620" y1="340" x2="676" y2="362" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="344" width="240" height="38" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="694" y="368" font-size="14" fill="#b45309" font-weight="700" text-anchor="start">Human</text><text x="906" y="368" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">everything else</text><line x1="620" y1="340" x2="676" y2="406" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="388" width="240" height="38" rx="8" fill="#fff" stroke="#15803d" stroke-width="2"/><text x="694" y="412" font-size="14" fill="#15803d" font-weight="700" text-anchor="start">Auto-OK</text><text x="906" y="412" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">model + 1 reader agree</text></svg>
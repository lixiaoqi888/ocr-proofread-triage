<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><text x="20" y="34" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Known errors routed for review</text><text x="20" y="58" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">984 pages, 118 errors found earlier by a page-by-page AI review</text><text x="288" y="105" font-size="14" fill="#1f2937" font-weight="400" text-anchor="end">Whole-page check by a vision model*</text><rect x="300" y="84" width="520" height="30" rx="6" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="0"/><rect x="300" y="84" width="130.0" height="30" rx="6" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="438.0" y="105" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">25%  (4 / 16)</text><text x="288" y="151" font-size="14" fill="#1f2937" font-weight="400" text-anchor="end">Round 1 (this method)</text><rect x="300" y="130" width="520" height="30" rx="6" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="0"/><rect x="300" y="130" width="449.49152542372883" height="30" rx="6" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="741.4915254237288" y="151" font-size="13" fill="#fff" font-weight="700" text-anchor="end">86%  (102 / 118)</text><text x="288" y="197" font-size="14" fill="#1f2937" font-weight="400" text-anchor="end">Round 2 / this repo</text><rect x="300" y="176" width="520" height="30" rx="6" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="0"/><rect x="300" y="176" width="506.77966101694915" height="30" rx="6" fill="#15803d" stroke="#15803d" stroke-width="0"/><text x="798.7796610169491" y="197" font-size="13" fill="#fff" font-weight="700" text-anchor="end">97%  (115 / 118)</text><text x="20" y="238" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">* small test: 3 segments, 83 pages, 16 errors. Round 2 rules were tuned on round-1 misses, so 97% is optimistic.</text><text x="20" y="284" font-size="16" fill="#1f2937" font-weight="700" text-anchor="start">Where the 118 errors ended up (this repo)</text><rect x="20" y="298" width="530.1694915254237" height="34" rx="0" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><rect x="550.1694915254237" y="298" width="366.4406779661017" height="34" rx="0" fill="#b45309" stroke="#b45309" stroke-width="0"/><rect x="916.6101694915254" y="298" width="15.59322033898305" height="34" rx="0" fill="#6b7280" stroke="#6b7280" stroke-width="0"/><rect x="932.2033898305085" y="298" width="7.796610169491525" height="34" rx="0" fill="#111827" stroke="#111827" stroke-width="0"/><rect x="20" y="348" width="14" height="14" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="40" y="360" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">Likely wrong  68</text><rect x="230" y="348" width="14" height="14" rx="3" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="250" y="360" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">Human  47</text><rect x="440" y="348" width="14" height="14" rx="3" fill="#6b7280" stroke="#6b7280" stroke-width="0"/><text x="460" y="360" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">Auto-OK (missed)  2</text><rect x="650" y="348" width="14" height="14" rx="3" fill="#111827" stroke="#111827" stroke-width="0"/><text x="670" y="360" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">Not found  1</text><text x="20" y="400" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">spots to look at per page:  round 1 → 1.24   |   round 2 → 1.77   |   this repo → 1.86</text></svg>